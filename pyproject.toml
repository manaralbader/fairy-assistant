[project]
name = "fairy"
version = "0.1.0"
description = "Fairycore Assistant — capstone, SDA-AIE-213 LLM Application Engineering"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "python-dotenv>=1"]
real-backend = ["openai>=1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
